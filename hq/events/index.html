<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Events | MtaaniWeb HQ</title>
<link rel="icon" href="https://res.cloudinary.com/hztm3zo8/image/upload/w_64,h_64,c_fill,q_auto,f_auto/v1782489344/20260611_134430_jn0ezd.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>
  try{ var t = localStorage.getItem('mtani-theme'); if(t) document.documentElement.setAttribute('data-theme', t); }catch(e){}
</script>


<style>
/* MtaaniWeb HQ shared styles. Same look as the homepage and the login page. */
:root{
  --cyan:#38B6FF; --purple:#9B59B6;
  --bg:#0D0B2B; --bg-glow:#1C1850;
  --ink:#FFFFFF; --muted:#8E8AB0;
  --line:#2B284F;
  --card:rgba(255,255,255,0.04);
  --card-hover:rgba(255,255,255,0.07);
  --field:rgba(255,255,255,0.05);
  --nav:rgba(13,11,43,0.92);
  --side:rgba(13,11,43,0.96);
  --btn-ink:#0A0820;
  --ok:#3DD598; --warn:#F2B35A; --err:#FF8A9B;
  --ok-bg:rgba(61,213,152,0.12); --warn-bg:rgba(242,179,90,0.13); --err-bg:rgba(228,87,107,0.14); --info-bg:rgba(56,182,255,0.12);
  --display:'Plus Jakarta Sans','Inter',system-ui,sans-serif;
  --side-w:252px; --top-h:60px;
}
:root[data-theme="light"]{
  --bg:#F4F3FB; --bg-glow:#E3E0F6;
  --ink:#0D0B2B; --muted:#5E5A7D;
  --line:#DAD7EC;
  --card:rgba(255,255,255,0.85);
  --card-hover:#FFFFFF;
  --field:#FFFFFF;
  --nav:rgba(244,243,251,0.94);
  --side:rgba(250,249,254,0.98);
  --ok:#17875F; --warn:#9A6209; --err:#C4304A;
  --ok-bg:rgba(23,135,95,0.1); --warn-bg:rgba(154,98,9,0.1); --err-bg:rgba(196,48,74,0.1); --info-bg:rgba(30,130,200,0.1);
}
*{box-sizing:border-box;margin:0;padding:0;}
html{-webkit-text-size-adjust:100%;}
body{font-family:'Inter',system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(circle at 20% 15%, var(--bg-glow) 0%, var(--bg) 55%);}
h1,h2,h3{font-family:var(--display);font-weight:800;letter-spacing:-0.03em;line-height:1.15;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;}
.mono{font-family:'JetBrains Mono',monospace;}
.muted{color:var(--muted);}
[hidden]{display:none !important;}

/* Top bar */
.hq-top{position:sticky;top:0;z-index:60;height:var(--top-h);display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--nav);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);}
.brand{display:flex;align-items:center;gap:10px;min-width:0;}
.logo-img,.logo-m{width:32px;height:32px;border-radius:9px;flex:none;}
.logo-img{object-fit:cover;background:var(--field);}
.logo-m{display:none;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--cyan),var(--purple));color:var(--btn-ink);font-family:var(--display);font-weight:800;font-size:1.05rem;}
.logo-fail .logo-img{display:none;}
.logo-fail .logo-m{display:flex;}
.wordmark{font-family:var(--display);font-weight:800;font-size:1.2rem;letter-spacing:-0.04em;}
.top-right{margin-left:auto;display:flex;align-items:center;gap:8px;}
.icon-btn{width:40px;height:40px;border-radius:100px;border:1px solid var(--line);background:var(--card);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;transition:border-color .15s;}
.icon-btn:hover{border-color:var(--cyan);}
.icon-btn svg{width:18px;height:18px;}
.avatar{width:40px;height:40px;border-radius:100px;border:1px solid var(--line);background:linear-gradient(135deg,var(--cyan),var(--purple));color:var(--btn-ink);font-weight:700;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;flex:none;font-size:0.95rem;padding:0;}
.avatar img{width:100%;height:100%;object-fit:cover;}
.pop-wrap{position:relative;}
.pop{position:absolute;right:0;top:48px;width:240px;background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:8px;box-shadow:0 12px 40px rgba(0,0,0,0.35);display:none;z-index:80;}
.pop.open{display:block;}
.pop .who{padding:10px 12px 12px;border-bottom:1px solid var(--line);margin-bottom:6px;}
.pop .who b{display:block;font-family:var(--display);font-size:1rem;}
.pop .who span{font-size:0.8rem;color:var(--muted);word-break:break-all;}
.pop a,.pop button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:none;color:var(--ink);padding:10px 12px;border-radius:10px;font-size:0.9rem;cursor:pointer;}
.pop a:hover,.pop button:hover{background:var(--card-hover);}
.pop svg{width:16px;height:16px;color:var(--muted);}

/* Sidebar */
.hq-side{position:fixed;top:var(--top-h);bottom:0;left:0;width:var(--side-w);background:var(--side);border-right:1px solid var(--line);overflow-y:auto;padding:18px 12px 12px;z-index:55;display:flex;flex-direction:column;transition:transform .2s;}
.side-label{font-size:0.7rem;letter-spacing:0.12em;color:var(--cyan);padding:0 10px 14px;}
.nav-group{margin-bottom:18px;}
.nav-group h4{font-size:0.68rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);padding:0 10px 6px;font-weight:700;font-family:'Inter',sans-serif;}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px;border-radius:11px;font-size:0.9rem;color:var(--muted);margin-bottom:2px;border:1px solid transparent;}
.nav-item svg{width:18px;height:18px;flex:none;}
.nav-item:hover{color:var(--ink);background:var(--card-hover);}
.nav-item.on{color:var(--ink);background:var(--info-bg);border-color:var(--line);}
.nav-item.on svg{color:var(--cyan);}
.side-foot{margin-top:auto;border-top:1px solid var(--line);padding:14px 6px 4px;display:flex;align-items:center;gap:10px;}
.side-foot .avatar{width:34px;height:34px;font-size:0.8rem;cursor:default;}
.side-foot .nm{font-size:0.85rem;font-weight:600;line-height:1.2;min-width:0;}
.side-foot .nm span{display:block;font-weight:400;color:var(--muted);font-size:0.72rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.side-foot .out{margin-left:auto;background:none;border:1px solid var(--line);color:var(--ink);border-radius:100px;padding:7px 12px;font-size:0.78rem;cursor:pointer;display:flex;align-items:center;gap:6px;}
.side-foot .out:hover{border-color:var(--cyan);}
.side-foot .out svg{width:14px;height:14px;}
.hq-backdrop{position:fixed;inset:var(--top-h) 0 0 0;background:rgba(5,4,20,0.6);z-index:54;display:none;}

.hq-main{padding:28px 28px 80px;max-width:1180px;}
@media (min-width:961px){
  body:not(.side-closed) .hq-main{margin-left:var(--side-w);}
  body.side-closed .hq-side{transform:translateX(-100%);}
}
@media (max-width:960px){
  .hq-side{transform:translateX(-100%);width:min(86vw,300px);}
  body.side-open .hq-side{transform:none;}
  body.side-open .hq-backdrop{display:block;}
  .hq-main{padding:20px 16px 80px;}
  .wordmark{font-size:1.1rem;}
}
.hq-boot{padding:80px 0;text-align:center;color:var(--muted);}

/* Page header */
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px;}
.page-head h1{font-size:clamp(1.6rem,4vw,2.2rem);}
.page-head .sub{color:var(--muted);font-size:0.92rem;margin-top:6px;max-width:62ch;}
.page-actions{display:flex;gap:10px;flex-wrap:wrap;}
.kick{display:block;font-size:0.72rem;letter-spacing:0.1em;color:var(--cyan);margin-bottom:6px;}

/* Cards and panels */
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;margin-bottom:18px;}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;}
.panel-head h2{font-size:1.05rem;}
.panel-head .link{font-size:0.82rem;color:var(--cyan);}
.panel .desc{color:var(--muted);font-size:0.88rem;margin:-8px 0 18px;max-width:64ch;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.grid-main{display:grid;grid-template-columns:1.6fr 1fr;gap:18px;align-items:start;}
@media (max-width:980px){.grid-main{grid-template-columns:1fr;}}
@media (max-width:640px){.grid2,.grid3{grid-template-columns:1fr;}}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:22px;}
@media (max-width:1100px){.stats{grid-template-columns:repeat(3,1fr);}}
@media (max-width:640px){.stats{grid-template-columns:1fr 1fr;}}
.stat{padding:18px;}
.stat .lbl{font-size:0.76rem;color:var(--muted);margin-bottom:8px;}
.stat .val{font-family:var(--display);font-weight:800;font-size:1.9rem;letter-spacing:-0.03em;}
.stat .note{font-size:0.72rem;color:var(--muted);margin-top:4px;}

/* Forms */
.fsec{margin-bottom:26px;}
.fsec:last-child{margin-bottom:0;}
.fsec > h3{font-size:0.74rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--cyan);margin-bottom:14px;font-family:'JetBrains Mono',monospace;font-weight:500;}
.field{margin-bottom:14px;}
.field label,.lab{display:block;font-size:0.8rem;color:var(--muted);margin-bottom:6px;}
.hint{font-size:0.76rem;color:var(--muted);margin-top:6px;}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=time],input[type=datetime-local],input[type=url],input[type=tel],select,textarea{
  width:100%;background:var(--field);border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--ink);font-size:0.95rem;font-family:'Inter',sans-serif;outline:none;transition:border-color .15s;-webkit-appearance:none;appearance:none;min-height:46px;
}
select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' fill='none' stroke='%238E8AB0' stroke-width='2' stroke-linecap='round'/></svg>");background-repeat:no-repeat;background-position:right 14px center;padding-right:36px;}
select option{color:#0D0B2B;background:#fff;}
textarea{min-height:96px;resize:vertical;}
input::placeholder,textarea::placeholder{color:#5F5C86;}
:root[data-theme="light"] input::placeholder,:root[data-theme="light"] textarea::placeholder{color:#9A97B8;}
input:focus,select:focus,textarea:focus{border-color:var(--cyan);}
input[type=checkbox],input[type=radio]{width:18px;height:18px;accent-color:var(--cyan);flex:none;}
.check{display:flex;align-items:center;gap:10px;font-size:0.92rem;cursor:pointer;}
.switch-row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:12px 0;border-bottom:1px solid var(--line);}
.switch-row:last-child{border-bottom:none;}
.switch-row .t{font-size:0.92rem;}
.switch-row .d{font-size:0.78rem;color:var(--muted);margin-top:2px;max-width:52ch;}
.switch{position:relative;width:46px;height:26px;flex:none;}
.switch input{position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:2;}
.switch i{position:absolute;inset:0;border-radius:100px;background:var(--field);border:1px solid var(--line);transition:background .15s;}
.switch i::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:transform .15s,background .15s;}
.switch input:checked + i{background:linear-gradient(90deg,var(--cyan),var(--purple));border-color:transparent;}
.switch input:checked + i::after{transform:translateX(20px);background:#fff;}

/* Chips */
.chips{display:flex;flex-wrap:wrap;gap:8px;}
.chip{font-size:0.84rem;padding:8px 14px;border-radius:100px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;transition:border-color .15s,background .15s;user-select:none;}
.chip:hover{border-color:var(--cyan);}
.chip.on{background:linear-gradient(90deg,var(--cyan),var(--purple));color:var(--btn-ink);border-color:transparent;font-weight:600;}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 20px;min-height:44px;border-radius:12px;font-size:0.9rem;font-weight:600;cursor:pointer;transition:border-color .15s;white-space:nowrap;}
.btn:hover{border-color:var(--cyan);}
.btn.primary{border:none;background:linear-gradient(90deg,var(--cyan),var(--purple));color:var(--btn-ink);}
.btn.danger{color:var(--err);}
.btn.danger:hover{border-color:var(--err);}
.btn.sm{min-height:34px;padding:0 14px;font-size:0.8rem;border-radius:10px;}
.btn[disabled]{opacity:0.55;cursor:default;}
.btn svg{width:16px;height:16px;}
.actions-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;}

/* Tabs */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
.tab{font-size:0.84rem;padding:8px 15px;border-radius:100px;border:1px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer;}
.tab:hover{border-color:var(--cyan);color:var(--ink);}
.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600;}
.tab .n{opacity:0.7;margin-left:4px;}

/* Lists */
.list{display:flex;flex-direction:column;}
.item{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);}
.item:last-child{border-bottom:none;}
.item .thumb{width:52px;height:52px;border-radius:12px;background:var(--field);border:1px solid var(--line);flex:none;object-fit:cover;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:0.7rem;overflow:hidden;}
.item .thumb img{width:100%;height:100%;object-fit:cover;}
.item .main{flex:1;min-width:0;}
.item .ttl{font-weight:600;font-size:0.95rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.item .meta{font-size:0.8rem;color:var(--muted);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.item .acts{display:flex;gap:8px;flex:none;flex-wrap:wrap;justify-content:flex-end;}
@media (max-width:640px){.item{flex-wrap:wrap;}.item .acts{width:100%;justify-content:flex-start;}}

.pill{display:inline-block;font-size:0.7rem;padding:3px 10px;border-radius:100px;font-weight:600;letter-spacing:0.02em;background:var(--field);color:var(--muted);border:1px solid var(--line);}
.pill.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent;}
.pill.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent;}
.pill.err{background:var(--err-bg);color:var(--err);border-color:transparent;}
.pill.info{background:var(--info-bg);color:var(--cyan);border-color:transparent;}
.pill.purple{background:rgba(155,89,182,0.16);color:#C79AE0;border-color:transparent;}
:root[data-theme="light"] .pill.purple{color:#7B3F96;}

/* Empty states */
.empty{border:1px dashed var(--line);border-radius:16px;padding:34px 20px;text-align:center;color:var(--muted);font-size:0.9rem;}
.empty b{display:block;font-family:var(--display);font-weight:800;font-size:1.05rem;color:var(--ink);margin-bottom:6px;letter-spacing:-0.02em;}
.empty .btn{margin-top:16px;}
.empty.sm{padding:22px 16px;}

/* Rows with a label and a value */
.kv{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid var(--line);font-size:0.9rem;}
.kv:last-child{border-bottom:none;}
.kv span:first-child{color:var(--muted);}
.rank{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:0.9rem;}
.rank:last-child{border-bottom:none;}
.rank .c{font-family:'JetBrains Mono',monospace;color:var(--muted);}

/* Media uploader */
.drop{border:1.5px dashed var(--line);border-radius:16px;padding:22px;text-align:center;color:var(--muted);font-size:0.88rem;background:var(--field);}
.drop.over{border-color:var(--cyan);}
.drop .btn{margin-top:12px;}
.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-top:14px;}
.m-tile{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--field);}
.m-tile img,.m-tile video{width:100%;height:100%;object-fit:cover;display:block;}
.m-tile .x{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;border:none;background:rgba(5,4,20,0.75);color:#fff;cursor:pointer;font-size:1rem;line-height:1;}
.m-tile .cv{position:absolute;left:6px;bottom:6px;font-size:0.64rem;padding:3px 8px;border-radius:100px;background:linear-gradient(90deg,var(--cyan),var(--purple));color:var(--btn-ink);font-weight:700;border:none;}
.m-tile .mk{position:absolute;left:6px;bottom:6px;font-size:0.64rem;padding:3px 8px;border-radius:100px;background:rgba(5,4,20,0.75);color:#fff;border:none;cursor:pointer;}
.m-tile.up{display:flex;align-items:center;justify-content:center;font-size:0.76rem;color:var(--muted);}

/* Hours editor */
.hours-row{display:grid;grid-template-columns:92px 1fr 1fr;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);}
.hours-row:last-child{border-bottom:none;}
.hours-row .closed{grid-column:2 / span 2;color:var(--muted);font-size:0.86rem;}
.hours-row input[type=time]{padding:8px 10px;min-height:40px;}
.hours-tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center;}
.hours-prev{font-size:0.82rem;color:var(--muted);margin-top:10px;}

/* Toast */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:200;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:13px 18px;font-size:0.9rem;box-shadow:0 12px 40px rgba(0,0,0,0.4);max-width:min(92vw,440px);}
.toast.ok{border-color:var(--ok);}
.toast.err{border-color:var(--err);}

/* Quick find */
.find-ov{position:fixed;inset:0;z-index:150;background:rgba(5,4,20,0.7);display:none;padding:70px 16px 16px;}
.find-ov.open{display:block;}
.find-box{max-width:600px;margin:0 auto;background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:14px;}
.find-res{max-height:55vh;overflow:auto;margin-top:10px;}
.find-res a{display:flex;justify-content:space-between;gap:12px;padding:11px 10px;border-radius:10px;font-size:0.92rem;}
.find-res a:hover{background:var(--card-hover);}
.find-res a span:last-child{color:var(--muted);font-size:0.76rem;}

/* Misc */
.divider{height:1px;background:var(--line);margin:20px 0;}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;}
.fee-box{border:1px solid var(--line);border-radius:14px;padding:6px 16px;background:var(--field);}
.counter{font-size:0.72rem;color:var(--muted);text-align:right;margin-top:4px;}
.sk{position:relative;overflow:hidden;border-radius:10px;background:var(--field);height:14px;margin-bottom:10px;}
.sk::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(142,138,176,0.22),transparent);animation:sweep 1.9s infinite linear;}
@keyframes sweep{to{transform:translateX(100%);}}
@media (prefers-reduced-motion:reduce){.sk::after{animation:none;}}
.bars{display:flex;align-items:flex-end;gap:8px;height:120px;margin-top:6px;}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%;font-size:0.68rem;color:var(--muted);}
.bars .b i{display:block;width:100%;border-radius:8px 8px 3px 3px;background:linear-gradient(180deg,var(--cyan),var(--purple));min-height:3px;}
.block-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
@media (max-width:900px){.block-grid{grid-template-columns:1fr 1fr;}}
.blk{padding:16px;border-radius:16px;border:1px solid var(--line);background:var(--card);}
.blk.now{border-color:var(--cyan);}
.blk .t{font-family:'JetBrains Mono',monospace;font-size:0.78rem;color:var(--muted);display:flex;justify-content:space-between;align-items:center;}
.blk .s{font-size:0.86rem;margin-top:8px;color:var(--muted);}
.blk.now .t{color:var(--cyan);}

</style>
</head>
<body>
<div id="content" hidden>
<div class="tabs" id="tabs"></div>
<div class="panel"><div id="list"><div class="sk"></div><div class="sk" style="width:70%"></div></div></div>

<div class="panel" id="formPanel">
  <div class="panel-head"><h2 id="formTitle">Add Event</h2><button type="button" class="btn sm" id="cancelEdit" hidden>Cancel edit</button></div>
  <div class="desc">Add what is coming up: concerts, markets, launches and anything worth getting out for.</div>
  <form id="ef" novalidate>
    <div class="fsec">
      <h3>Basics</h3>
      <div class="field"><label for="title">Event title</label><input type="text" id="title" placeholder="The name of the event" autocomplete="off"></div>
      <div class="field"><label for="slug">Page address</label><input type="text" id="slug" placeholder="Generated from the title, you can edit it" autocomplete="off"><div class="hint" id="slugHint">mtaaniweb.co.ke/event/</div></div>
      <div class="field"><label for="venue">Venue</label><input type="text" id="venue" placeholder="Venue or business name"></div>
      <div class="grid2">
        <div class="field"><label for="area">Area</label><select id="area"></select></div>
        <div class="field"><label for="category">Category</label><select id="category"></select></div>
      </div>
      <div class="grid3">
        <div class="field"><label for="date">Date</label><input type="date" id="date"></div>
        <div class="field"><label for="start">Start time</label><input type="time" id="start"></div>
        <div class="field"><label for="end">End time</label><input type="time" id="end"></div>
      </div>
      <div class="field"><label for="description">Description</label><textarea id="description" style="min-height:130px" placeholder="What is happening, who it is for and why it is worth going."></textarea></div>
      <div class="field"><label for="entry">Entry</label><input type="text" id="entry" placeholder="Free, or ticket price such as KES 1,500"></div>
    </div>

    <div class="fsec"><h3>Vibes</h3><div id="vibes"></div></div>

    <div class="fsec">
      <h3>Links</h3>
      <div class="field"><label for="businessId">Related business</label><select id="businessId"></select><div class="hint">Optional. The event will also show on that business's profile.</div></div>
      <div class="grid2" id="socials"></div>
    </div>

    <div class="fsec">
      <h3>Contact</h3>
      <div class="grid2">
        <div class="field"><label for="phone">Phone</label><input type="tel" id="phone" placeholder="+254 7XX XXX XXX"></div>
        <div class="field"><label for="whatsapp">WhatsApp</label><input type="tel" id="whatsapp" placeholder="+254 7XX XXX XXX"></div>
      </div>
      <div class="field"><label for="link">Website or ticket link</label><input type="url" id="link" placeholder="https://tickets.example.co.ke (optional)"></div>
    </div>

    <div class="fsec"><h3>Media</h3><div id="media"></div></div>

    <div class="fsec">
      <h3>Publishing</h3>
      <div class="grid3">
        <div class="field"><label for="priority">Editorial priority</label><select id="priority"><option value="normal">Normal</option><option value="high">High</option><option value="top">Top pick</option></select></div>
        <div class="field"><label for="status">Status</label><select id="status"><option value="draft">Draft</option><option value="published">Published</option><option value="cancelled">Cancelled</option></select></div>
        <div class="field"><label for="expiry">Expiry</label><input type="date" id="expiry"><div class="hint">Optional. Defaults to the event date.</div></div>
      </div>
    </div>

    <div class="actions-row">
      <button type="submit" class="btn primary" id="saveBtn">Publish Event</button>
      <button type="button" class="btn" id="draftBtn">Save as Draft</button>
    </div>
  </form>
</div>

</div>
