<style>
/* MtaaniWeb public styles. Same tokens as the homepage and HQ. */
:root{
    --cyan:#38B6FF; --purple:#9B59B6;
    --bg:#0D0B2B; --bg-glow:#1C1850;
    --ink:#FFFFFF; --muted:#8E8AB0;
    --line:#2B284F;
    --card:rgba(255,255,255,0.04);
    --card-hover:rgba(255,255,255,0.07);
    --field:rgba(255,255,255,0.05);
    --nav:rgba(13,11,43,0.88);
    --btn-ink:#0A0820;
    --display:'Plus Jakarta Sans','Inter',system-ui,sans-serif;
  }
  :root[data-theme="light"]{
    --bg:#F4F3FB; --bg-glow:#E3E0F6;
    --ink:#0D0B2B; --muted:#5E5A7D;
    --line:#DAD7EC;
    --card:rgba(255,255,255,0.8);
    --card-hover:#FFFFFF;
    --field:#FFFFFF;
    --nav:rgba(244,243,251,0.92);
  }

  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'Inter',system-ui,sans-serif;color:var(--ink);background:var(--bg);
    line-height:1.55;-webkit-font-smoothing:antialiased;
    padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  }
  /* One static gradient, same as the login page. No animation, no repaint cost. */
  body::before{
    content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:radial-gradient(circle at 20% 15%, var(--bg-glow) 0%, var(--bg) 55%);
  }
  h1,h2,h3{font-family:var(--display);font-weight:800;letter-spacing:-0.03em;line-height:1.1;}
  a{color:inherit;text-decoration:none;}
  .mono{font-family:'JetBrains Mono',monospace;}
  .wrap{max-width:1160px;margin:0 auto;padding:0 24px;}

  /* Shared card style, taken from the login page */
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:20px;
    transition:border-color .15s, background .15s;
  }
  a.card:hover{border-color:var(--cyan);background:var(--card-hover);}

  /* Nav */
  nav{position:sticky;top:0;z-index:50;background:var(--nav);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);}
  nav .wrap{display:flex;align-items:center;justify-content:space-between;height:64px;}
  .logo{font-family:var(--display);font-weight:800;font-size:1.3rem;letter-spacing:-0.04em;}
  .nav-right{display:flex;align-items:center;gap:10px;}
  .icon-btn{width:40px;height:40px;border-radius:100px;border:1px solid var(--line);background:var(--card);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:border-color .15s;}
  .icon-btn:hover{border-color:var(--cyan);}
  .icon-btn svg{width:17px;height:17px;}
  .menu-btn{height:40px;padding:0 18px;border-radius:100px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:600;font-size:0.88rem;cursor:pointer;font-family:inherit;transition:border-color .15s;}
  .menu-btn:hover{border-color:var(--cyan);}

  /* Menu overlay */
  .menu-overlay{position:fixed;inset:0;z-index:100;background:var(--bg);padding:24px;overflow-y:auto;display:none;}
  .menu-overlay.open{display:block;}
  .menu-top{display:flex;justify-content:space-between;align-items:center;max-width:1160px;margin:0 auto 36px;height:40px;}
  .menu-list{display:grid;grid-template-columns:1fr 1fr;gap:0 40px;max-width:720px;margin:0 auto;}
  @media (max-width:620px){.menu-list{grid-template-columns:1fr;}}
  .menu-list a{font-family:var(--display);font-weight:800;font-size:clamp(1.5rem,4vw,2rem);letter-spacing:-0.03em;padding:14px 0;border-bottom:1px solid var(--line);transition:color .15s;}
  .menu-list a:hover{color:var(--cyan);}

  /* Hero */
  .hero{padding:84px 0 60px;border-bottom:1px solid var(--line);}
  .eyebrow{font-size:0.78rem;letter-spacing:0.06em;color:var(--muted);margin-bottom:18px;}
  .hero h1{font-size:clamp(2.4rem,7vw,4.5rem);letter-spacing:-0.045em;line-height:1;max-width:13ch;}
  .grad{background:linear-gradient(90deg,var(--cyan),var(--purple));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;}
  .hero p.sub{margin-top:20px;font-size:1.1rem;color:var(--muted);max-width:46ch;}
  .vibe-search{margin-top:34px;max-width:660px;padding:6px;display:flex;gap:6px;}
  .vibe-search:focus-within{border-color:var(--cyan);}
  .vibe-search input{flex:1;min-width:0;border:none;outline:none;background:transparent;padding:14px 16px;font-size:1rem;font-family:'Inter',sans-serif;color:var(--ink);}
  .vibe-search input::placeholder{color:#5F5C86;}
  .btn-grad{border:none;border-radius:12px;padding:0 24px;background:linear-gradient(90deg,var(--cyan),var(--purple));color:var(--btn-ink);font-weight:600;font-size:0.95rem;cursor:pointer;font-family:inherit;white-space:nowrap;}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;align-items:center;}
  .chips .try{font-size:0.82rem;color:var(--muted);}
  .chip{font-size:0.84rem;padding:7px 14px;border-radius:100px;border:1px solid var(--line);background:var(--card);cursor:pointer;color:var(--ink);font-family:inherit;transition:border-color .15s;}
  .chip:hover{border-color:var(--cyan);}

  /* Sections */
  .section{padding:72px 0 0;}
  .section-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:24px;}
  .section-head h2{font-size:clamp(1.6rem,3.6vw,2.4rem);}
  .kick{display:block;font-size:0.74rem;letter-spacing:0.1em;color:var(--cyan);margin-bottom:8px;}
  .see-all{font-size:0.88rem;color:var(--cyan);white-space:nowrap;}
  .see-all:hover{text-decoration:underline;}

  /* Right now */
  .rail{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
  @media (max-width:900px){.rail{grid-template-columns:1fr 1fr;}}
  .period{padding:22px;}
  .period .tl{display:flex;justify-content:space-between;align-items:center;font-size:0.76rem;color:var(--muted);letter-spacing:0.06em;text-transform:uppercase;}
  .now-badge{display:none;font-size:0.64rem;padding:3px 9px;border-radius:100px;background:linear-gradient(90deg,var(--cyan),var(--purple));color:var(--btn-ink);letter-spacing:0.08em;font-weight:500;}
  .period h3{font-size:1.2rem;margin:12px 0 14px;}
  .period ul{list-style:none;display:flex;flex-wrap:wrap;gap:6px;}
  .period li{font-size:0.8rem;padding:5px 11px;border-radius:100px;border:1px solid var(--line);color:var(--muted);}
  .period.active{border-color:var(--cyan);}
  .period.active .now-badge{display:inline-block;}
  .period.active .tl{color:var(--cyan);}
  .period.active li{color:var(--ink);}

  /* Live and trending: empty state with a light skeleton shimmer */
  .feed-panel{padding:26px;}
  .feed-msg{margin-bottom:20px;}
  .feed-msg strong{display:block;font-family:var(--display);font-weight:800;font-size:1.1rem;letter-spacing:-0.02em;margin-bottom:4px;}
  .feed-msg span{color:var(--muted);font-size:0.9rem;}
  .ghost-row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  @media (max-width:760px){.ghost-row{grid-template-columns:1fr;}.ghost-row .ghost:nth-child(n+2){display:none;}}
  .ghost{border:1px solid var(--line);border-radius:16px;padding:14px;}
  .sk{position:relative;overflow:hidden;border-radius:10px;background:var(--field);}
  .sk::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(142,138,176,0.22),transparent);animation:sweep 1.9s infinite linear;}
  @keyframes sweep{to{transform:translateX(100%);}}
  .ghost .img{height:110px;margin-bottom:14px;}
  .ghost .l{height:11px;margin-bottom:9px;}
  .ghost .l.s{width:55%;margin-bottom:0;}

  /* Move cards */
  .movegrid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;}
  @media (max-width:980px){.movegrid{grid-template-columns:repeat(2,1fr);}.movegrid .move:last-child{grid-column:span 2;}}
  .move{padding:22px 20px;display:block;}
  .move .ico{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;margin-bottom:18px;border:1px solid var(--line);background:var(--field);}
  .move .ico svg{width:20px;height:20px;stroke:var(--cyan);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .move h3{font-size:1.15rem;margin-bottom:6px;}
  .move p{font-size:0.83rem;color:var(--muted);}

  /* Weekend */
  .weekend{padding:clamp(28px,5vw,48px);display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap;}
  .weekend h2{font-size:clamp(1.6rem,4vw,2.4rem);max-width:16ch;}
  .weekend p{margin-top:12px;color:var(--muted);max-width:40ch;}
  .btn-link{display:inline-block;padding:13px 26px;border-radius:12px;background:linear-gradient(90deg,var(--cyan),var(--purple));color:var(--btn-ink);font-weight:600;font-size:0.92rem;white-space:nowrap;}

  /* Areas */
  .areas{display:flex;flex-wrap:wrap;gap:10px;}
  .area-pill{padding:11px 20px;border-radius:100px;border:1px solid var(--line);background:var(--card);font-size:0.9rem;transition:border-color .15s;}
  .area-pill:hover{border-color:var(--cyan);}
  .area-pill.more{border-style:dashed;color:var(--muted);}

  /* Categories */
  .catgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
  @media (max-width:980px){.catgrid{grid-template-columns:repeat(2,1fr);}}
  .cat{padding:22px 20px;display:block;}
  .cat h3{font-size:1.1rem;margin-bottom:6px;}
  .cat p{font-size:0.83rem;color:var(--muted);}

  /* Essentials */
  .ess{display:flex;flex-wrap:wrap;gap:10px;}
  .ess span{padding:9px 18px;border-radius:100px;border:1px dashed var(--line);color:var(--muted);font-size:0.88rem;}

  /* Footer */
  footer{margin-top:90px;border-top:1px solid var(--line);padding:52px 0 28px;}
  .foot-grid{display:grid;grid-template-columns:1.5fr repeat(4,1fr);gap:32px;margin-bottom:36px;}
  @media (max-width:860px){.foot-grid{grid-template-columns:1fr 1fr;}.foot-grid > div:first-child{grid-column:span 2;}}
  .foot-grid h4{font-size:0.76rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);margin-bottom:14px;font-weight:700;font-family:'Inter',sans-serif;}
  .foot-grid ul{list-style:none;}
  .foot-grid li{margin-bottom:9px;font-size:0.9rem;}
  .foot-grid li a:hover{color:var(--cyan);}
  .flogo{font-family:var(--display);font-weight:800;font-size:1.4rem;letter-spacing:-0.04em;margin-bottom:8px;}
  .ftag{color:var(--muted);max-width:26ch;font-size:0.9rem;}
  .foot-bottom{border-top:1px solid var(--line);padding-top:18px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;font-size:0.76rem;color:var(--muted);}

  @media (prefers-reduced-motion:reduce){.sk::after{animation:none;}}

/* ---- Shared page pieces for the public site ---- */
img{max-width:100%;display:block;}
.crumb{font-size:0.82rem;color:var(--muted);padding:22px 0 0;}
.crumb a:hover{color:var(--cyan);}
.pagehead{padding:26px 0 8px;}
.pagehead h1{font-size:clamp(2rem,5vw,3rem);letter-spacing:-0.04em;}
.pagehead .sub{color:var(--muted);margin-top:10px;max-width:56ch;}
.page-main{padding-bottom:20px;min-height:60vh;}
.updated{font-size:0.78rem;color:var(--muted);margin:10px 0 28px;}
.lg-body{max-width:70ch;padding-bottom:30px;}
.lg-body h2{font-size:1.15rem;margin:30px 0 10px;letter-spacing:-0.02em;}
.lg-body p{color:var(--muted);margin-bottom:14px;font-size:0.97rem;}
.lg-body ul{color:var(--muted);font-size:0.97rem;margin:0 0 14px 20px;}
.lg-body li{margin-bottom:7px;}
.lg-body a{color:var(--cyan);}
.lg-body strong{color:var(--ink);}
.empty-feed{border:1px dashed var(--line);border-radius:20px;padding:52px 24px;text-align:center;color:var(--muted);margin:24px 0 60px;}
.empty-feed b{display:block;font-family:var(--display);font-weight:800;color:var(--ink);font-size:1.15rem;margin-bottom:6px;letter-spacing:-0.02em;}

/* Business profile */
.gallery{display:grid;grid-template-columns:1.6fr 1fr;gap:8px;margin-top:18px;border-radius:20px;overflow:hidden;}
.g-main,.g-side div{background:linear-gradient(135deg,var(--purple),var(--cyan));overflow:hidden;}
.g-main{aspect-ratio:4/3;}
.g-side{display:grid;grid-template-rows:1fr 1fr;gap:8px;}
.g-side div{background:linear-gradient(135deg,#1C1850,var(--purple));}
.gallery img{width:100%;height:100%;object-fit:cover;}
.gallery.single{grid-template-columns:1fr;}
.gallery.single .g-main{aspect-ratio:16/9;}
@media (max-width:700px){.gallery{grid-template-columns:1fr;}.g-side{grid-template-columns:1fr 1fr;grid-template-rows:none;aspect-ratio:2/1;}}
.biz-head{padding:28px 0 6px;display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;align-items:flex-start;}
.biz-head h1{font-size:clamp(1.9rem,5vw,2.8rem);margin-bottom:10px;}
.biz-meta{font-size:0.95rem;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:0.76rem;font-weight:600;padding:5px 12px;border-radius:100px;border:1px solid var(--line);background:var(--card);}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--cyan);}
.badge.verified{color:#3DD598;border-color:rgba(61,213,152,0.4);}
.badge.verified::before{background:#3DD598;}
.badge.featured::before{background:#F2B35A;}
.badge.sponsored::before{background:var(--purple);}
:root[data-theme="light"] .badge.verified{color:#17875F;}
.counts{display:flex;gap:22px;}
.counts .n{display:block;font-family:var(--display);font-weight:800;font-size:1.5rem;letter-spacing:-0.03em;color:var(--ink);}
.counts div{font-size:0.78rem;color:var(--muted);text-align:right;}
.open-line{margin:14px 0 18px;font-size:0.95rem;display:flex;align-items:center;gap:8px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block;}
.dot.on{background:#3DD598;}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
.act{padding:12px 22px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:0.92rem;font-weight:600;cursor:pointer;color:var(--ink);font-family:inherit;transition:border-color .15s;}
.act:hover{border-color:var(--cyan);}
.act.primary{border:none;background:linear-gradient(90deg,var(--cyan),var(--purple));color:var(--btn-ink);}
.act.saved{border-color:var(--cyan);color:var(--cyan);}
.act.ghost{border-style:dashed;color:var(--muted);font-weight:500;}
.lead{padding:10px 0 30px;font-size:1.08rem;max-width:62ch;border-bottom:1px solid var(--line);}
.vtags{display:flex;gap:8px;flex-wrap:wrap;padding:24px 0;border-bottom:1px solid var(--line);}
.vtag{font-size:0.82rem;padding:7px 15px;border-radius:100px;border:1px solid var(--line);background:var(--card);}
.block{padding:32px 0;border-bottom:1px solid var(--line);}
.block h2{font-size:1.25rem;margin-bottom:14px;}
.block p{color:var(--muted);max-width:64ch;white-space:pre-line;}
.plain{list-style:none;}
.plain li{padding:10px 0;border-bottom:1px solid var(--line);font-size:0.96rem;}
.plain li:last-child{border-bottom:none;}
.happen{padding:18px 20px;display:block;margin-bottom:10px;}
.happen .tag{font-size:0.74rem;color:var(--cyan);letter-spacing:0.08em;margin-bottom:4px;}
.happen strong{font-family:var(--display);font-weight:800;letter-spacing:-0.02em;}
.happen p{margin-top:4px;font-size:0.88rem;}
.finds{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
@media (max-width:700px){.finds{grid-template-columns:1fr;}}
.find{display:block;overflow:hidden;}
.find .im{height:120px;background:linear-gradient(135deg,var(--purple),var(--cyan));}
.find .im img{width:100%;height:100%;object-fit:cover;}
.find .fb{padding:14px 16px;}
.find h3{font-size:1rem;margin-bottom:4px;}
.find p{font-size:0.8rem;color:var(--muted);}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;}
@media (max-width:700px){.info-grid{grid-template-columns:1fr;}}
.info-grid h3{font-size:0.74rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;font-family:'Inter',sans-serif;font-weight:700;}
.info-grid p{font-size:0.95rem;}
.info-grid a{color:var(--cyan);}
.notice{padding:22px;margin:32px 0 20px;font-size:0.85rem;color:var(--muted);}
.notice a.rep{color:var(--cyan);cursor:pointer;text-decoration:underline;}
.reasons{display:none;margin-top:14px;}
.reasons.open{display:block;}
.reasons label{display:flex;align-items:center;gap:8px;margin-bottom:8px;color:var(--ink);}
.reasons input[type=radio]{accent-color:var(--cyan);}
.reasons textarea{width:100%;background:var(--field);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--ink);font-family:inherit;margin:6px 0 10px;min-height:70px;}
.reasons button{border:none;border-radius:12px;padding:10px 20px;background:linear-gradient(90deg,var(--cyan),var(--purple));color:var(--btn-ink);font-weight:600;cursor:pointer;font-family:inherit;}
.skel{padding:40px 0;}

/* ===== Phase 2 additions ===== */
[hidden]{display:none !important;}
button{font-family:inherit;}
/* Top bar, same pattern as HQ */
.pub-top{position:sticky;top:0;z-index:60;height:64px;display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--nav);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);}
.brand{display:flex;align-items:center;gap:10px;min-width:0;}
.logo-img,.logo-m{width:32px;height:32px;border-radius:9px;flex:none;}
.logo-img{object-fit:cover;background:var(--field);}
.logo-m{display:none;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--cyan),var(--purple));color:var(--btn-ink);font-family:var(--display);font-weight:800;font-size:1.05rem;}
.logo-fail .logo-img{display:none;}.logo-fail .logo-m{display:flex;}
.wordmark{font-family:var(--display);font-weight:800;font-size:1.2rem;letter-spacing:-0.04em;}
.top-right{margin-left:auto;display:flex;align-items:center;gap:8px;}
.icon-btn{position:relative;}
.sdot{position:absolute;top:-4px;right:-4px;min-width:17px;height:17px;border-radius:100px;padding:0 4px;background:linear-gradient(90deg,var(--cyan),var(--purple));color:var(--btn-ink);font-size:0.62rem;font-weight:700;display:flex;align-items:center;justify-content:center;}
.menu-top{align-items:center;}
.flogo{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.fsoc{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;font-size:0.85rem;}.fsoc a:hover{color:var(--cyan);}
/* Layout helpers */
.sec{padding:56px 0 0;}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px;}
.sec-head h2{font-size:clamp(1.5rem,3.4vw,2.2rem);}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
@media (max-width:980px){.grid4{grid-template-columns:repeat(2,1fr);}.grid3{grid-template-columns:repeat(2,1fr);}}
@media (max-width:620px){.grid3,.grid2{grid-template-columns:1fr;}}
.grid3 .ghost:nth-child(n+3){display:block;}
/* Tiles */
.tile{display:block;overflow:hidden;}
.tim{position:relative;aspect-ratio:16/10;background:linear-gradient(135deg,#1C1850,var(--purple));overflow:hidden;}
.tim img{width:100%;height:100%;object-fit:cover;}
.ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,rgba(56,182,255,0.25),rgba(155,89,182,0.35));}
.ph span{font-family:var(--display);font-weight:800;font-size:2.6rem;color:rgba(255,255,255,0.85);}
.tb{position:absolute;left:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap;}
.mini{font-size:0.7rem;font-weight:600;padding:4px 10px;border-radius:100px;background:rgba(13,11,43,0.82);color:#fff;border:1px solid rgba(255,255,255,0.14);}
.mini.ok{color:#3DD598;}.mini.sp{color:#d9b3ec;}
.mini.t-live{background:#E5484D;border-color:#E5484D;}.mini.t-today,.mini.t-soon{background:linear-gradient(90deg,var(--cyan),var(--purple));color:var(--btn-ink);border:none;}
.tbd{padding:14px 16px 16px;}
.tbd h3{font-size:1.05rem;margin-bottom:4px;}
.tm{font-size:0.8rem;color:var(--muted);}
.td{font-size:0.86rem;color:var(--muted);margin-top:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.to{font-size:0.8rem;margin-top:8px;display:flex;align-items:center;gap:7px;}.to:empty{display:none;}
/* Controls */
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:22px 0 6px;}
.chip.on{border-color:var(--cyan);color:var(--cyan);background:var(--card-hover);}
.sel,.inp,.txt{background:var(--field);border:1px solid var(--line);border-radius:12px;color:var(--ink);font-family:inherit;font-size:0.95rem;padding:12px 14px;width:100%;}
.sel{width:auto;padding:9px 14px;border-radius:100px;font-size:0.84rem;}
.inp:focus,.txt:focus,.sel:focus{outline:none;border-color:var(--cyan);}
.txt{min-height:120px;resize:vertical;}
.fl{display:block;font-size:0.8rem;font-weight:600;margin:16px 0 6px;}
.fl small{font-weight:400;color:var(--muted);}
.form{max-width:640px;padding:26px;margin:26px 0;}
.form .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}@media (max-width:560px){.form .row2{grid-template-columns:1fr;}}
.form .go{margin-top:22px;}
.hp{position:absolute;left:-9999px;}
.msg{margin-top:14px;font-size:0.9rem;}.msg.ok{color:#3DD598;}.msg.err{color:#FF8A8A;}
.more{display:block;margin:26px auto 0;}
.act{display:inline-block;}
.ptoast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--bg);border:1px solid var(--cyan);border-radius:100px;padding:10px 20px;font-size:0.88rem;z-index:200;transition:all .2s;}
.ptoast.show{opacity:1;transform:translate(-50%,0);}
/* Home */
.hero .mono{font-size:0.78rem;}
.vibe-card{padding:clamp(22px,4vw,40px);}
.vc-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;}
.vc-part{display:flex;align-items:center;gap:10px;font-size:0.8rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--cyan);}
.vibe-card h3{font-size:clamp(1.7rem,4.4vw,2.8rem);margin:14px 0 8px;}
.vibe-card .copy{color:var(--muted);max-width:60ch;}
.vc-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:26px 36px;margin-top:30px;}@media (max-width:700px){.vc-grid{grid-template-columns:1fr;}}
.vc-sec h4{font-family:'JetBrains Mono',monospace;font-size:0.74rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;font-weight:500;}
.vc-sec a{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:0.95rem;}
.vc-sec a:hover{color:var(--cyan);}
.vc-sec a small{color:var(--muted);white-space:nowrap;}
.vc-sec .none{font-size:0.88rem;color:var(--muted);padding:10px 0;border-bottom:1px dashed var(--line);}
.trend-row{display:flex;gap:8px;flex-wrap:wrap;}
.cat-card{padding:22px 20px;display:block;}.cat-card h3{font-size:1.1rem;margin-bottom:6px;}.cat-card p{font-size:0.83rem;color:var(--muted);}
.ess a{padding:9px 18px;border-radius:100px;border:1px solid var(--line);background:var(--card);font-size:0.88rem;}.ess a:hover{border-color:var(--cyan);}
.ess{display:flex;flex-wrap:wrap;gap:10px;}
.ghost{border:1px solid var(--line);border-radius:16px;padding:14px;}
.ghost .img{height:110px;margin-bottom:14px;}.ghost .l{height:11px;margin-bottom:9px;}.ghost .l.s{width:55%;}
.live-note{font-size:0.82rem;color:var(--muted);}
/* Event detail + guide */
.facts{display:grid;gap:10px;margin:18px 0;}
.fact{display:flex;gap:12px;align-items:flex-start;font-size:1rem;}
.tag-live{display:inline-block;font-size:0.8rem;font-weight:600;padding:5px 12px;border-radius:100px;border:1px solid var(--line);background:var(--card);margin-bottom:14px;}
.prose{max-width:68ch;font-size:1.05rem;line-height:1.75;}
.prose p{margin:0 0 1.2em;color:var(--ink);opacity:.92;}
.prose h2{font-size:1.5rem;margin:1.8em 0 .6em;}.prose h3{font-size:1.2rem;margin:1.5em 0 .5em;}
.prose ul,.prose ol{margin:0 0 1.2em 1.3em;}.prose li{margin-bottom:.4em;}
.prose a{color:var(--cyan);text-decoration:underline;}
.prose blockquote{border-left:3px solid var(--cyan);padding:2px 0 2px 18px;color:var(--muted);margin:0 0 1.2em;}
.byline{color:var(--muted);font-size:0.88rem;display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 22px;}
.cover{border-radius:20px;overflow:hidden;margin:6px 0 30px;aspect-ratio:16/8;background:linear-gradient(135deg,#1C1850,var(--purple));}.cover img{width:100%;height:100%;object-fit:cover;}
.rank{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;padding:14px 4px;border-bottom:1px solid var(--line);}
.rank .n{font-family:'JetBrains Mono',monospace;color:var(--muted);}.rank a:hover{color:var(--cyan);}.rank small{color:var(--muted);}
.saved-card{position:relative;}
.saved-card .rm{position:absolute;right:10px;top:10px;z-index:2;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:rgba(13,11,43,0.82);color:#fff;cursor:pointer;font-size:1rem;}
.acc{border:1px solid var(--line);border-radius:16px;background:var(--card);margin-bottom:10px;overflow:hidden;}
.acc summary{padding:16px 20px;cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:12px;}
.acc summary::after{content:"+";color:var(--cyan);font-size:1.2rem;}.acc[open] summary::after{content:"\2212";}
.acc div{padding:0 20px 18px;color:var(--muted);font-size:0.95rem;}.acc a{color:var(--cyan);}
.steps{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:22px 0;}
.step{padding:10px 18px;border-radius:100px;border:1px solid var(--line);background:var(--card);font-size:0.88rem;font-weight:600;}
.arrow{color:var(--cyan);}
.pkg{padding:26px;display:flex;flex-direction:column;gap:12px;}
.pkg .price{font-family:var(--display);font-weight:800;font-size:2rem;letter-spacing:-0.04em;}
.pkg ul{list-style:none;color:var(--muted);font-size:0.92rem;}.pkg li{padding:6px 0;border-bottom:1px solid var(--line);}.pkg li:last-child{border:none;}
.pkg .act{margin-top:auto;text-align:center;}
.hub{padding:24px;display:block;}.hub h3{font-size:1.2rem;margin-bottom:8px;}.hub p{color:var(--muted);font-size:0.92rem;margin-bottom:16px;}
.callout{padding:22px 24px;margin:26px 0;color:var(--muted);font-size:0.92rem;}
.hours-list{list-style:none;margin-top:8px;font-size:0.9rem;color:var(--muted);}.hours-list li{display:flex;justify-content:space-between;padding:4px 0;}.hours-list li.today{color:var(--ink);font-weight:600;}
.sharebar{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0;}
.note-q{padding:18px 20px;margin:16px 0;border-left:3px solid var(--cyan);}
.interp{font-size:0.82rem;color:var(--muted);margin:10px 0 0;}
.group-h{font-family:'JetBrains Mono',monospace;font-size:0.76rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);margin:34px 0 14px;}
.pill-list{display:flex;flex-wrap:wrap;gap:10px;}
.area-pill b{font-weight:600;}.area-pill small{color:var(--muted);margin-left:6px;}
.notfound{padding:90px 0;text-align:center;}

</style>
